name: Track Daily Unique Views (PAT push)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-uniques:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Fetch views (uses GITHUB_TOKEN for API read)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/traffic/views" -o /tmp/views.json || true

      - name: Update traffic.json
        run: |
          mkdir -p .github
          if [ ! -f .github/traffic.json ]; then
            cat > .github/traffic.json <<'JSON'
{
  "total_daily_uniques_sum": 0,
  "last_processed": "1970-01-01T00:00:00Z"
}
JSON
          fi

          LAST=$(jq -r '.last_processed' .github/traffic.json)

          if [ ! -s /tmp/views.json ] || ! jq -e '.views' /tmp/views.json >/dev/null 2>&1; then
            echo "No views yet"
            exit 0
          fi

          VIEWS_JSON=$(cat /tmp/views.json)
          new_uniques=$(jq --arg last "$LAST" '[.views[] | select(.timestamp > $last) | .uniques] | add // 0' <<<"$VIEWS_JSON")
          newest_ts=$(jq -r '[.views[] | .timestamp] | max // empty' <<<"$VIEWS_JSON")

          if [ -z "$newest_ts" ]; then
            NEW_LAST="$LAST"
          else
            NEW_LAST="$newest_ts"
          fi

          tmp=$(mktemp)
          jq --argjson nu "$new_uniques" --arg newlast "$NEW_LAST" \
            '.total_daily_uniques_sum += ($nu // 0) | .last_processed = $newlast' \
            .github/traffic.json > "$tmp" && mv "$tmp" .github/traffic.json

          cat .github/traffic.json

      - name: Push using PAT
        env:
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/traffic.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update daily unique totals"
          REPO_URL="https://x-access-token:${GH_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git push "$REPO_URL" HEAD:${{ github.event.repository.default_branch }}
